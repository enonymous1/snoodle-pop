<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Snoodle Pop architecture: board model in the centre, input, renderer, audio and state machine around it">
  <style>
    .box { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 12; }
    .title { fill: #f8fafc; font: 600 14px system-ui, sans-serif; text-anchor: middle; }
    .sub { fill: #94a3b8; font: 12px system-ui, sans-serif; text-anchor: middle; }
    .arrow { stroke: #7dd3fc; stroke-width: 1.5; fill: none; marker-end: url(#head); }
    .note { fill: #94a3b8; font: 12px system-ui, sans-serif; text-anchor: middle; }
  </style>
  <defs><marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7dd3fc"/></marker></defs>
  <rect x="0" y="0" width="720" height="340" fill="#0f172a"/>
  <text x="360" y="24" class="title">Snoodle Pop — target architecture (today: all in one game.js)</text>
  <g>
    <rect x="260" y="60" width="200" height="70" class="box"/>
    <text x="360" y="88" class="title">Board model (pure)</text>
    <text x="360" y="108" class="sub">grid, neighbours, cluster, drop</text>
    <text x="360" y="124" class="sub">no DOM, no canvas — testable</text>
  </g>
  <g>
    <rect x="20" y="170" width="190" height="70" class="box"/>
    <text x="115" y="198" class="title">Input</text>
    <text x="115" y="218" class="sub">pointer, keyboard → events</text>
  </g>
  <g>
    <rect x="265" y="170" width="190" height="70" class="box"/>
    <text x="360" y="198" class="title">Renderer</text>
    <text x="360" y="218" class="sub">canvas, sprites, particles</text>
  </g>
  <g>
    <rect x="510" y="170" width="190" height="70" class="box"/>
    <text x="605" y="198" class="title">Audio / HUD</text>
    <text x="605" y="218" class="sub">WebAudio, score, status</text>
  </g>
  <g>
    <rect x="265" y="270" width="190" height="50" class="box"/>
    <text x="360" y="300" class="title">State machine</text>
  </g>
  <path class="arrow" d="M150,170 L300,130"/>
  <path class="arrow" d="M360,170 L360,130"/>
  <path class="arrow" d="M570,170 L420,130"/>
  <path class="arrow" d="M360,240 L360,270"/>
  <text x="360" y="335" class="note">Arrows: Input emits aim/shoot/swap · Renderer takes a board snapshot · State machine owns playing/paused/levelClear/gameOver</text>
</svg>
